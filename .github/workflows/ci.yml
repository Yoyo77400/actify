name: CI

# Intégration continue : valide chaque PR et chaque push sur main/develop.
# deploy.yml est chaîné sur ce workflow (workflow_run) : le déploiement ne
# part sur le VPS que si ce run est vert sur un push main.
on:
  pull_request:
  push:
    branches: [main, develop]

# Un seul run par branche : un nouveau push annule le run devenu obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule : aucune étape n'écrit dans le repo ni ne publie quoi que ce soit.
permissions:
  contents: read

jobs:
  # ── API (Express + Prisma) ─────────────────────────────────────────────────
  # Typage strict + suite Vitest. Aucune base de données requise : les tests
  # sont unitaires et vitest.config.ts injecte le JWT_SECRET nécessaire.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API_ACTIFY_NODE
    steps:
      - uses: actions/checkout@v4
        with:
          # Aucune étape n'utilise git après le checkout : pas de token persisté.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: API_ACTIFY_NODE/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Le client Prisma est émis en TS dans generated/ (gitignored) et inclus
      # dans le tsconfig → il doit exister avant tsc et les tests. `generate`
      # ne se connecte pas à la base, pas besoin de DATABASE_URL.
      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier le typage
        run: npx tsc --noEmit

      - name: Lancer les tests
        run: npm test

  # ── Front (Nuxt) ───────────────────────────────────────────────────────────
  # `npm ci` déclenche `nuxt prepare` (postinstall) → génère .nuxt/, requis par
  # le typecheck ET par eslint.config.mjs (qui importe .nuxt/eslint.config.mjs).
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT_ACTIFY
    steps:
      - uses: actions/checkout@v4
        with:
          # Aucune étape n'utilise git après le checkout : pas de token persisté.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONT_ACTIFY/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le typage
        run: npm run typecheck

      - name: Linter
        run: npx eslint .

  # ── E2E (Playwright : front réel → API réelle → Postgres pglite) ───────────
  # Le job installe LES DEUX packages : Playwright démarre lui-même l'API
  # (webServer, cwd ../API_ACTIFY_NODE) puis le front, et les pilote dans
  # Chromium. Aucun service externe — la base est un pglite en mémoire, et les
  # signatures XRPL sont produites en page (cf. section Tests du README).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Aucune étape n'utilise git après le checkout : pas de token persisté.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            API_ACTIFY_NODE/package-lock.json
            FRONT_ACTIFY/package-lock.json

      - name: Installer les dépendances de l'API
        working-directory: API_ACTIFY_NODE
        run: npm ci

      - name: Installer les dépendances du front
        working-directory: FRONT_ACTIFY
        run: npm ci

      # Chromium seul : c'est le seul projet déclaré dans playwright.config.ts.
      - name: Installer Chromium
        working-directory: FRONT_ACTIFY
        run: npx playwright install --with-deps chromium

      # CI=true bascule la config en mode strict : pas de réutilisation d'un
      # serveur déjà lancé, 2 retries, et `test.only` fait échouer le run.
      - name: Lancer les tests e2e
        working-directory: FRONT_ACTIFY
        run: npm run test:e2e

      # Le rapport HTML porte traces, captures et vidéos des retries : c'est ce
      # qui rend un échec diagnosticable sans rejouer le run en local.
      - name: Archiver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FRONT_ACTIFY/playwright-report/
          retention-days: 7

  # ── Images Docker ──────────────────────────────────────────────────────────
  # Reproduit les builds `target: production` de docker-compose.prod.yml (sans
  # push) : un Dockerfile cassé fait échouer la CI, donc bloque le déploiement
  # chaîné (deploy.yml) avant qu'il ne parte sur le VPS.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Aucune étape n'utilise git après le checkout : pas de token persisté.
          persist-credentials: false

      - name: Build image API
        run: docker build --target production ./API_ACTIFY_NODE

      - name: Build image front
        run: docker build --target production ./FRONT_ACTIFY
